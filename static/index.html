<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>phantom</title>
  <meta name="description" content="Phantom - Modern Minimalist Web Terminal">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="phantom">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Preload Complete JetBrainsMono Nerd Font -->
  <link rel="preload" href="/vendor/fonts/JetBrainsMonoNerdFont-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/vendor/fonts/JetBrainsMonoNerdFont-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Xterm styles -->
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="tab-bar">
      <div id="tabs-container"></div>
      <button id="btn-new-tab" title="Tab Baru (Alt+T)">+</button>
      <div id="tab-actions">
        <button id="pwa-install-btn" title="Pasang sebagai aplikasi PWA">Install</button>
      </div>
    </div>
    <div id="terminal-container"></div>
  </div>

  <!-- Xterm and Addons -->
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <!-- Main Application -->
  <script src="/app.js"></script>
</body>
</html>
