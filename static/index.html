<!DOCTYPE html>
<html lang="en" class="dark" data-theme="coolnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NodeDeck — Modern WebSSH & SFTP Workspace</title>
  <meta name="description" content="NodeDeck - Modern Web SSH Terminal, SFTP Explorer & Snippets">
  <meta name="theme-color" content="#00111E">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NodeDeck">

  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts: Google Fonts fallback + local preloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/vendor/fonts/JetBrainsMonoNerdFont-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/vendor/fonts/JetBrainsMonoNerdFont-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="/vendor/tailwindcss.js"></script>
  <script src="/vendor/lucide.js"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ["'JetBrainsMono Nerd Font'", "'JetBrains Mono'", 'monospace'],
            }
          }
        }
      };
    }
  </script>

  <!-- Xterm styles & Custom Theme variables -->
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css?v=20261114-v13">
</head>
<body class="h-screen w-screen flex flex-col text-xs antialiased" data-theme="coolnight">

  <!-- =========================================================================
       1. TOP 40px HEADER CHROME BAR
       ========================================================================= -->
  <header class="h-[40px] t-bg-surface border-b t-border flex items-center justify-between px-2.5 gap-2 shrink-0 z-30 smooth-transition">
    <!-- Left: NodeDeck Home Logo + Sidebar Toggle + Live Tabs -->
    <div class="flex items-center gap-1.5 min-w-0 flex-1">
      <!-- Logo Home Button -->
      <button id="homeLogoBtn" onclick="window.NodeDeck.switchTab('launcher')" title="NodeDeck Home / Omnibox (Alt+1)"
        class="flex items-center gap-2 px-2.5 py-1 rounded-lg border border-transparent t-accent-soft font-semibold smooth-transition shrink-0">
        <div class="w-4 h-4 rounded t-accent-bg flex items-center justify-center font-bold shadow-sm">
          <i data-lucide="terminal" class="w-2.5 h-2.5"></i>
        </div>
        <span class="font-semibold tracking-tight text-xs">NodeDeck</span>
      </button>

      <!-- Sidebar Toggle (Ctrl+B) -->
      <button id="sidebarToggleBtn" onclick="window.NodeDeck.toggleLeftSidebar()" title="Toggle Sidebar (Ctrl+B)"
        class="w-7 h-7 rounded-lg flex items-center justify-center t-text-secondary hover:t-text-primary t-hover-bg border border-transparent hover:t-border smooth-transition shrink-0">
        <i id="sidebarToggleIcon" data-lucide="panel-left-close" class="w-3.5 h-3.5"></i>
      </button>

      <div class="h-3.5 w-[1px] t-border border-l mx-0.5 shrink-0"></div>

      <!-- Live Tabs Strip -->
      <div id="tabsStrip" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>

      <!-- Quick New Tab / Connect Button -->
      <button onclick="window.NodeDeck.switchTab('launcher')" title="New Connection (Home)"
        class="w-6 h-6 rounded-lg flex items-center justify-center t-text-muted hover:t-text-primary t-hover-bg smooth-transition shrink-0">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Center: Quick Command Palette Trigger (Large Screen) -->
    <div class="hidden xl:flex items-center justify-center shrink-0">
      <button onclick="window.NodeDeck.openCommandPalette()" class="flex items-center gap-5 px-3 py-1 rounded-lg t-bg-base hover:t-bg-elevated border t-border hover:t-border-strong text-[11px] t-text-muted smooth-transition">
        <span class="flex items-center gap-1.5">
          <i data-lucide="search" class="w-3 h-3 t-accent-text"></i>
          <span>Search hosts or Quick SSH...</span>
        </span>
        <kbd class="px-1.5 py-0.2 rounded t-bg-surface border t-border font-mono text-[10px] t-text-secondary">Ctrl K</kbd>
      </button>
    </div>

    <!-- Right Actions: Latency Ping + Split View 50/50 + Theme Switcher -->
    <div class="flex items-center justify-end gap-1.5 shrink-0">
      <button onclick="window.NodeDeck.openCommandPalette()" class="xl:hidden p-1.5 rounded-lg t-text-muted t-hover-bg" title="Command Palette (Ctrl+K)">
        <i data-lucide="search" class="w-3.5 h-3.5"></i>
      </button>

      <!-- Live Ping Badge -->
      <div id="topBarPingBadge" title="Live RTT Latency"
        class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-lg t-bg-base border t-border font-mono text-[11px] t-text-secondary shrink-0">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
        </span>
        <span id="topBarPingValue">-- ms</span>
      </div>

      <!-- Split View 50/50 Toggle -->
      <button id="splitToggleBtn" onclick="window.NodeDeck.toggleSplitPane()" title="Split View 50/50 (Ctrl+\)"
        class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg border t-border text-[11px] t-text-secondary t-hover-bg smooth-transition">
        <i data-lucide="columns-2" class="w-3.5 h-3.5"></i>
        <span class="hidden lg:inline">Split</span>
      </button>

      <!-- Theme Dropdown Button -->
      <div class="relative" id="themeDropdownWrap">
        <button id="themeDropdownBtn" onclick="window.NodeDeck.toggleThemeMenu(event)" title="Switch Terminal Theme"
          class="flex items-center gap-2 px-2.5 py-1 rounded-lg t-bg-base hover:t-bg-elevated border t-border hover:t-border-strong text-[11px] t-text-primary smooth-transition">
          <span id="themeActiveDot" class="w-2.5 h-2.5 rounded-full bg-[#0FC5ED] ring-1 ring-white/25"></span>
          <span id="themeActiveLabel" class="font-medium">Coolnight</span>
          <i data-lucide="chevron-down" class="w-3 h-3 t-text-muted"></i>
        </button>

        <!-- Theme Menu -->
        <div id="themeDropdownMenu" class="hidden absolute right-0 mt-1.5 w-48 rounded-xl glass-modal border t-border-strong shadow-2xl py-1.5 z-50">
          <div class="px-3 py-1 text-[9px] font-mono uppercase tracking-wider t-text-muted">Terminal Themes</div>
          <button onclick="window.NodeDeck.selectThemeFromMenu('coolnight')" data-theme-item="coolnight"
            class="theme-menu-item w-full px-3 py-1.5 text-left text-[11px] flex items-center justify-between t-hover-bg smooth-transition">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#0FC5ED]"></span>
              <span>Coolnight</span>
            </span>
            <i data-lucide="check" class="theme-check w-3.5 h-3.5 t-accent-text hidden"></i>
          </button>
          <button onclick="window.NodeDeck.selectThemeFromMenu('cutiepro')" data-theme-item="cutiepro"
            class="theme-menu-item w-full px-3 py-1.5 text-left text-[11px] flex items-center justify-between t-hover-bg smooth-transition">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#F56E7F]"></span>
              <span>CutiePro</span>
            </span>
            <i data-lucide="check" class="theme-check w-3.5 h-3.5 t-accent-text hidden"></i>
          </button>
          <button onclick="window.NodeDeck.selectThemeFromMenu('monokai')" data-theme-item="monokai"
            class="theme-menu-item w-full px-3 py-1.5 text-left text-[11px] flex items-center justify-between t-hover-bg smooth-transition">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#98E024]"></span>
              <span>Monokai Remastered</span>
            </span>
            <i data-lucide="check" class="theme-check w-3.5 h-3.5 t-accent-text hidden"></i>
          </button>
          <button onclick="window.NodeDeck.selectThemeFromMenu('fahrenheit')" data-theme-item="fahrenheit"
            class="theme-menu-item w-full px-3 py-1.5 text-left text-[11px] flex items-center justify-between t-hover-bg smooth-transition">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#FD9F4D]"></span>
              <span>Fahrenheit</span>
            </span>
            <i data-lucide="check" class="theme-check w-3.5 h-3.5 t-accent-text hidden"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       2. MIDDLE SHELL: 280px LEFT SIDEBAR + PRIMARY WORKSPACE CANVAS
       ========================================================================= -->
  <div class="flex-1 flex min-h-0 relative">

    <!-- 280px COLLAPSIBLE & RESIZABLE SIDEBAR PANEL (Hosts, SFTP, Snippets) -->
    <aside id="leftSidebar" class="w-[280px] min-w-[200px] max-w-[85vw] t-bg-surface border-r t-border flex flex-col shrink-0 z-20 relative">
      <!-- Top Segmented Nav Tabs -->
      <div class="p-2 border-b t-border shrink-0">
        <div class="grid grid-cols-3 p-0.5 rounded-lg t-bg-base border t-border gap-0.5">
          <button onclick="window.NodeDeck.setSidebarTab('hosts')" data-stab="hosts"
            class="stab-btn py-1.5 rounded-md text-[11px] font-medium flex items-center justify-center gap-1.5 smooth-transition">
            <i data-lucide="server" class="w-3 h-3"></i>
            <span>Hosts</span>
          </button>
          <button onclick="window.NodeDeck.setSidebarTab('sftp')" data-stab="sftp"
            class="stab-btn py-1.5 rounded-md text-[11px] font-medium flex items-center justify-center gap-1.5 smooth-transition">
            <i data-lucide="folder" class="w-3 h-3"></i>
            <span>SFTP</span>
          </button>
          <button onclick="window.NodeDeck.setSidebarTab('snippets')" data-stab="snippets"
            class="stab-btn py-1.5 rounded-md text-[11px] font-medium flex items-center justify-center gap-1.5 smooth-transition">
            <i data-lucide="zap" class="w-3 h-3"></i>
            <span>Snippets</span>
          </button>
        </div>
      </div>

      <!-- Sidebar Dynamic Content Container -->
      <div id="leftSidebarBody" class="flex-1 flex flex-col min-h-0 overflow-hidden"></div>

      <!-- Drag to resize handle -->
      <div id="sidebarResizer" class="sidebar-resizer" title="Drag to resize sidebar"></div>
    </aside>

    <!-- PRIMARY WORKSPACE CANVAS (Home Omnibox OR Active Terminals) -->
    <main id="mainCanvas" class="flex-1 flex min-w-0 min-h-0 relative overflow-hidden"></main>

  </div>

  <!-- =========================================================================
       MOBILE TOUCH KEY BAR
       ========================================================================= -->
  <div id="mobile-keys">
    <button type="button" class="key-btn" data-key="esc">ESC</button>
    <button type="button" class="key-btn" data-key="tab">TAB</button>
    <button type="button" class="key-btn" data-key="ctrl">CTRL</button>
    <button type="button" class="key-btn" data-key="c">^C</button>
    <button type="button" class="key-btn" data-key="d">^D</button>
    <button type="button" class="key-btn" data-key="z">^Z</button>
    <button type="button" class="key-btn" data-key="up">↑</button>
    <button type="button" class="key-btn" data-key="down">↓</button>
    <button type="button" class="key-btn" data-key="left">←</button>
    <button type="button" class="key-btn" data-key="right">→</button>
    <button type="button" class="key-btn" data-key="pipe">|</button>
    <button type="button" class="key-btn" data-key="tilde">~</button>
    <button type="button" class="key-btn" data-key="slash">/</button>
  </div>

  <!-- =========================================================================
       3. BOTTOM 24px STATUS TELEMETRY BAR
       ========================================================================= -->
  <footer class="h-[24px] t-bg-surface border-t t-border px-3 flex items-center justify-between text-[10px] font-mono t-text-muted shrink-0 z-30 smooth-transition">
    <div class="flex items-center gap-3">
      <span class="flex items-center gap-1.5 text-emerald-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>WS Heartbeat: 25s</span>
      </span>
      <span class="opacity-40">|</span>
      <span id="telemetryLatency" class="t-text-secondary">RTT: -- ms</span>
      <span class="hidden sm:inline opacity-40">|</span>
      <span id="telemetryGrid" class="hidden sm:inline t-text-secondary">--×--</span>
      <span class="hidden md:inline opacity-40">|</span>
      <span class="hidden md:inline">SSH-2.0</span>
    </div>

    <div class="flex items-center gap-3">
      <span class="hidden lg:inline"><kbd class="t-text-secondary">Ctrl+B</kbd> Sidebar</span>
      <span class="hidden md:inline"><kbd class="t-text-secondary">Ctrl+K</kbd> Palette</span>
      <span class="hidden md:inline"><kbd class="t-text-secondary">Ctrl+\</kbd> Split</span>
      <span id="telemetrySessionBadge" class="t-accent-text font-medium">HOME · READY</span>
    </div>
  </footer>

  <!-- =========================================================================
       COMMAND PALETTE MODAL (Ctrl+K)
       ========================================================================= -->
  <div id="cmdPaletteBackdrop" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-start justify-center pt-[12vh] p-4">
    <div class="w-full max-w-lg rounded-2xl glass-modal border t-border-strong shadow-2xl overflow-hidden">
      <div class="px-3.5 py-2.5 border-b t-border flex items-center gap-2.5">
        <i data-lucide="terminal" class="w-4 h-4 t-accent-text shrink-0"></i>
        <input id="cmdPaletteInput" type="text" placeholder="Type user@host:port, search hosts, or run action..."
          class="flex-1 bg-transparent text-xs t-text-primary placeholder:opacity-50 focus:outline-none font-mono" />
        <kbd class="px-1.5 py-0.5 rounded t-bg-base border t-border text-[10px] font-mono t-text-muted">ESC</kbd>
      </div>
      <div id="cmdPaletteList" class="max-h-72 overflow-y-auto p-1.5 space-y-0.5"></div>
    </div>
  </div>

  <!-- =========================================================================
       ADD / EDIT HOST MODAL
       ========================================================================= -->
  <div id="nodeModalBackdrop" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl glass-modal border t-border-strong shadow-2xl overflow-hidden">
      <div class="px-4 py-3 border-b t-border flex items-center justify-between">
        <span id="nodeModalTitle" class="font-semibold text-xs t-text-primary">Add New Host</span>
        <button onclick="window.NodeDeck.closeNodeModal()" class="p-1 rounded t-hover-bg t-text-muted hover:t-text-primary">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <form id="nodeModalForm" class="p-4 space-y-3">
        <input type="hidden" id="editNodeId" />
        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Host Alias / Name</label>
            <input id="nodeAlias" type="text" required placeholder="e.g. server-01 or homelab"
              class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border text-xs t-text-primary focus:outline-none focus:t-border-strong" />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Network</label>
            <select id="nodeEnv" class="w-full px-2.5 py-1.5 rounded-lg t-bg-base border t-border text-xs t-text-primary focus:outline-none">
              <option value="LAN">LAN</option>
              <option value="Tailscale">Tailscale</option>
              <option value="Tunnel">Tunnel</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-2.5">
          <div class="col-span-3">
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Host / IP / Domain</label>
            <input id="nodeHost" type="text" required placeholder="192.168.1.100 or ssh.example.com"
              class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border font-mono text-xs t-text-primary focus:outline-none" />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Port</label>
            <input id="nodePort" type="number" value="22" required
              class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border font-mono text-xs t-text-primary focus:outline-none" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Username</label>
            <input id="nodeUser" type="text" required placeholder="e.g. ubuntu or debian"
              class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border font-mono text-xs t-text-primary focus:outline-none" />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Auth Method</label>
            <select id="nodeAuth" onchange="window.NodeDeck.onModalAuthChange()" class="w-full px-2.5 py-1.5 rounded-lg t-bg-base border t-border text-xs t-text-primary focus:outline-none">
              <option value="key">SSH Key</option>
              <option value="password">Password</option>
            </select>
          </div>
        </div>
        <div id="nodePasswordGroup" class="hidden">
          <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">Password</label>
          <input id="nodePassword" type="password" placeholder="Password"
            class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border font-mono text-xs t-text-primary focus:outline-none" />
        </div>
        <div id="nodeKeyGroup">
          <label class="block text-[10px] uppercase tracking-wider t-text-muted mb-1">SSH Key Path (optional)</label>
          <input id="nodeKeyPath" type="text" placeholder="~/.ssh/id_ed25519"
            class="w-full px-3 py-1.5 rounded-lg t-bg-base border t-border font-mono text-xs t-text-primary focus:outline-none" />
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="window.NodeDeck.closeNodeModal()" class="px-3 py-1.5 rounded-lg t-text-muted hover:t-text-primary t-hover-bg">Cancel</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg t-accent-bg font-semibold">Save Host</button>
        </div>
      </form>
    </div>
  </div>

  <!-- =========================================================================
       FILE PREVIEW & EDITOR MODAL (OpenCode Style)
       ========================================================================= -->
  <div id="fileEditorBackdrop" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6">
    <div class="w-full max-w-4xl h-[85vh] rounded-2xl glass-modal border t-border-strong shadow-2xl flex flex-col overflow-hidden">
      <!-- Editor Header -->
      <div class="px-4 py-2.5 border-b t-border flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <i data-lucide="file-code" class="w-4 h-4 t-accent-text shrink-0"></i>
          <span id="editorFileName" class="font-semibold text-xs t-text-primary truncate">file.txt</span>
          <span id="editorDirtyDot" class="w-2 h-2 rounded-full bg-amber-400 hidden" title="Unsaved changes"></span>
          <span id="editorFilePath" class="font-mono text-[10px] t-text-muted px-2 py-0.5 rounded t-bg-base border t-border truncate max-w-xs sm:max-w-md">-</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="editorSaveBtn" onclick="window.NodeDeck.saveEditedFile()" class="px-3 py-1.5 rounded-lg t-accent-bg font-semibold text-xs flex items-center gap-1.5 shadow-sm smooth-transition">
            <i data-lucide="save" class="w-3.5 h-3.5"></i>
            <span>Save (Ctrl+S)</span>
          </button>
          <button onclick="window.NodeDeck.downloadCurrentFile()" title="Download file" class="p-1.5 rounded-lg t-bg-base border t-border t-text-muted hover:t-text-primary t-hover-bg">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
          </button>
          <button onclick="window.NodeDeck.closeFileEditor()" class="p-1.5 rounded-lg t-hover-bg t-text-muted hover:t-text-primary">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <!-- Editor Body -->
      <div class="flex-1 flex min-h-0 bg-[#080808] font-mono text-xs">
        <div id="editorLineNumbers" class="w-12 py-3 pr-2 text-right text-zinc-600 select-none overflow-hidden font-mono border-r border-white/5">1</div>
        <textarea id="editorTextarea" spellcheck="false" autocomplete="off" autocapitalize="off"
          class="flex-1 p-3 bg-transparent text-zinc-200 outline-none resize-none font-mono text-xs leading-relaxed overflow-y-auto no-scrollbar"></textarea>
      </div>
      <!-- Editor Status Bar -->
      <div class="h-6 px-3 border-t t-border flex items-center justify-between text-[10px] font-mono t-text-muted shrink-0">
        <div class="flex items-center gap-3">
          <span id="editorLineCount">0 lines</span>
          <span>|</span>
          <span id="editorFileSize">0 KB</span>
        </div>
        <span>UTF-8</span>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       CONFIRM DELETE MODAL
       ========================================================================= -->
  <div id="confirmDeleteBackdrop" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl glass-modal border border-rose-500/40 shadow-2xl p-4 space-y-3">
      <div class="flex items-center gap-2.5 text-rose-400 font-semibold text-xs">
        <i data-lucide="alert-triangle" class="w-4 h-4"></i>
        <span>Confirm Deletion</span>
      </div>
      <p class="text-xs t-text-secondary leading-relaxed">Are you sure you want to permanently delete this item?</p>
      <div id="deleteTargetText" class="p-2 rounded-lg t-bg-base border t-border font-mono text-[11px] t-text-primary truncate">-</div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="window.NodeDeck.closeDeleteModal()" class="px-3 py-1.5 rounded-lg t-text-muted hover:t-text-primary t-hover-bg text-xs">Cancel</button>
        <button id="confirmDeleteBtn" class="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs smooth-transition">Delete Permanently</button>
      </div>
    </div>
