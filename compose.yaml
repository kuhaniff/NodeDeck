services:
  nodedeck:
    hostname: node01
    build:
      context: .
      dockerfile: Dockerfile
    image: nodedeck:latest
    container_name: nodedeck
    init: true
    restart: unless-stopped
    ports:
      - "${NODEDECK_BIND_IP:-127.0.0.1}:${NODEDECK_PORT:-8090}:8090"
    environment:
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
      - USER_NAME=${USER_NAME:-hermes}
      - ENABLE_SUDO=${ENABLE_SUDO:-true}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - TERM=xterm-256color
      - COLORTERM=truecolor
    volumes:
      - /home/hermes:/home/hermes
      - ${STACKS_DIR:-/home/aneep/stacks}:/home/aneep/stacks
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/usr/share/nodedeck/data
      - ./static:/usr/share/nodedeck/static:ro
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    working_dir: /home/hermes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
